# Workflow의 이름
name: Feature Branch API CI

# 실행 트리거
on:

  # 메인 브렌치에 PR이 왔을 경우
  pull_request:
    branches:
      - main

jobs:
  build:
    # 잡을 실행할 서버 버전
    runs-on: ubuntu-latest

    # job 안에서 수행될 것
    steps:
      # 체크아웃
      - name: Checkout
        # 남이 만든 것을 사용 -> GitHub Repository의 코드를 현재 Runner로 내려 받음
        uses: actions/checkout@v6

      # Java 개발 환경을 가져옴
      - name: Setup Java
        # Java 개발 환경 설정 Action을 가져다 사용
        uses: actions/setup-java@v4
        # 세부 설정
        with:
          java-version: '21'
          distribution: 'temurin'

      # gradlew 실행 권한 부여
      - name: Grant execute permission
        run: chmod +x gradlew

      # 빌드 시작
      - name: Build
        run: ./gradlew build