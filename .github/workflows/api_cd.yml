# Workflow의 이름
name: API CD

# 실행 트리거
on:
  # main에 push 될 경우 실행 (PR 후 머지되면서 push 됨)
  push:
    branches:
      - main

# GitHub가 AWS OIDC 토큰을 발급할 수 있도록 권한 부여
permissions:
  # OIDC를 사용 쓰기 권한
  id-token: write
  contents: read


jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # AWS IAM Role Assume
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::975050095892:role/github-actions-test-api-role
          aws-region: ap-northeast-2

      # AWS 로그인 확인
      - name: Check AWS Identity
        # GitHub Actions가 AWS에서 누구로 인증되어 있는지 확인 하는 명령어
        run: aws sts get-caller-identity