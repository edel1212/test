# Workflow의 이름
name: API CD

# 실행 트리거
on:
  # main에 push 될 경우 실행 (PR 후 머지되면서 push 됨)
  push:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission
        run: chmod +x gradlew
      
      # 빌드
      - name: Build JAR
        run: ./gradlew build

      - name: Build Docker Image
        run: docker build -t test-api:latest .